name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.4'
      - run: uv pip install --system --override server/overrides.txt -r server/requirements.txt
      - run: python -m unittest discover -s server/tests -p 'test_*.py' -v
        env:
          PYTHONPATH: server
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server/static/app.js
      - run: docker compose config --quiet
      - run: docker build -t pdf-ai-translator-server:test .
      - run: docker run --rm -e PYTHONPATH=/app/server -e RUN_TRANSLATION_INTEGRATION=1 pdf-ai-translator-server:test python -m unittest tests.test_translation_integration -v
